name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      DASHBOARD_PASSWORD: ci-only-password
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:remote-sync
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-evidence
          path: |
            /tmp/uktl-browser-smoke-evidence-*
            /tmp/uktl-libsql-smoke-evidence-*
          if-no-files-found: ignore
          retention-days: 7
